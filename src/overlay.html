<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Usage</title>
<style>
:root{--bg:rgba(252,251,253,.97);--fg:#1d1b22;--sub:#76717f;--track:rgba(20,16,30,.09);--fill:#1d1b22;--low:#d9574f;
  --edge:rgba(20,16,30,.08);--shadow:0 4px 14px rgba(20,16,30,.16),0 1px 3px rgba(20,16,30,.1)}
@media (prefers-color-scheme:dark){
  :root{--bg:rgba(36,34,42,.95);--fg:#f3f1f6;--sub:#a6a1b0;--track:rgba(255,255,255,.12);--fill:#f3f1f6;--low:#ff7b72;
    --edge:rgba(255,255,255,.1);--shadow:0 4px 16px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3)}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
body{padding:10px;font-family:-apple-system,system-ui;color:var(--fg);-webkit-font-smoothing:antialiased}

.card{display:inline-block;width:184px;padding:12px 14px 11px;border-radius:12px;background:var(--bg);
  box-shadow:var(--shadow),0 0 0 .5px var(--edge)}
.top{display:flex;align-items:baseline;gap:6px}
.big{font-size:26px;font-weight:300;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1}
.label{font-size:11px;color:var(--sub)}
.reset{margin-left:auto;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:2px;margin:10px 0 9px;border-radius:2px;background:var(--track);overflow:hidden}
.fill{height:100%;width:0;border-radius:2px;background:var(--fill);transition:width .8s cubic-bezier(.2,.8,.2,1),background .3s}
.fill.low{background:var(--low)}
.row{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.row b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="card" id="pill">
  <div class="top"><span class="big" id="left">—</span><span class="label">left</span><span class="reset" id="time"></span></div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="row"><span>This week</span><b id="week">—</b></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const post = (msg) => { try { window.webkit.messageHandlers.app.postMessage(msg); } catch (_) {} };
const PAD = 10;
let local = null, plan = null;

function dur(ms) {
  if (ms <= 0) return "now";
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d ${h % 24}h` : h ? `${h}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`;
}

// Resets come back as e.g. 01:59:59.9, so round to the nearest minute before showing them.
const minute = (ms) => new Date(Math.round(ms / 60e3) * 60e3);
const clock = (ms) => minute(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s/g, "").toLowerCase();
const day = (ms) => minute(ms).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });

window.setTheme = () => {};  // the card keeps to the system's light or dark look
document.addEventListener("mousedown", (e) => { if (e.button === 0) post({ cmd: "dismiss" }); });
new ResizeObserver(() => {
  const r = $("pill").getBoundingClientRect();
  post({ cmd: "size", w: Math.ceil(r.width) + 2 * PAD, h: Math.ceil(r.height) + 2 * PAD });
}).observe($("pill"));

function render() {
  const s = plan && plan.session, w = plan && plan.weekly;
  // Round "used" first, like Claude's usage page, so the two always add up to 100.
  const left = s ? Math.max(0, Math.min(100, 100 - Math.round(s.used))) : null;
  // Fall back to our own estimate of the reset if the plan limits couldn't be read.
  const reset = s ? s.resetsAt : local && local.blockEnd;

  $("left").textContent = left == null ? "—" : Math.round(left) + "%";
  $("fill").style.width = (left == null ? 0 : Math.max(left, 2)) + "%";
  $("fill").classList.toggle("low", left != null && left < 20);
  $("time").textContent = reset ? "resets " + clock(reset) : "";
  $("week").textContent = w ? Math.round(w.used) + "% used" : "—";
  $("pill").title = plan && plan.error ? `couldn't read plan limits: ${plan.error}` : [
    s ? `session: ${Math.round(s.used)}% used` + (s.resetsAt ? ` · resets in ${dur(s.resetsAt - Date.now())}` : "") : "",
    w ? `week (all models): ${Math.round(w.used)}% used` + (w.resetsAt ? ` · resets ${day(w.resetsAt)}` : "") : "",
  ].filter(Boolean).join("\n");
}

window.update = (d) => { local = d; render(); };
// A failed refresh keeps the last good numbers on screen; the tooltip says what went wrong.
window.limits = (d) => { plan = d.error && plan && plan.session ? { ...plan, error: d.error } : d; render(); };
</script>
</body>
</html>
