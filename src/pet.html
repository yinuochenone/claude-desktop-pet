<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Pet</title>
<style>
:root{--ink:#1c1924}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
#stage{position:absolute;inset:0}
/* #pet is the hit box Swift uses (centred, bottom 6, 34×34); keep the two in sync. */
#pet{position:absolute;left:113px;bottom:6px;width:34px;height:34px}
canvas{position:absolute;left:0;bottom:0;pointer-events:none}

/* floating bits: hearts, sparkles, notes, z's */
.fx{position:absolute;pointer-events:none;line-height:1;white-space:nowrap;will-change:transform,opacity}
.fx svg{display:block}
.fx.mark{font:600 12px ui-rounded,-apple-system,system-ui;color:var(--ink);-webkit-text-stroke:2.5px #fff;paint-order:stroke fill}
.fx.zz{font:500 10px ui-rounded,-apple-system,system-ui;color:#c9c2df;text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* what it says: a small quiet pill */
#bubble{position:absolute;left:50%;bottom:52px;opacity:0;pointer-events:none;transform:translate(-50%,4px);
  transition:opacity .22s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
#bubble.show{opacity:1;transform:translate(-50%,0)}
#bubble .box{padding:3px 8px 4px;border-radius:9px;background:rgba(255,255,255,.95);color:#1d1a24;white-space:nowrap;
  font:500 11px/1.25 ui-rounded,-apple-system,system-ui;letter-spacing:.1px;
  box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08)}
/* at home the menu bar sits above its head, so the bubble goes to its left */
#stage.home #bubble{left:auto;transform:translate(4px,0)}
#stage.home #bubble.show{transform:none}
@media (prefers-color-scheme:dark){
  #bubble .box{background:rgba(40,38,46,.94);color:#f2f0f6;box-shadow:0 1px 4px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.12)}
}

/* the bedroom page (pet.html?bed) */
body.bedmode #stage{display:none}
#bedroom{display:none;position:absolute;inset:0}
body.bedmode #bedroom{display:block}
#bedcanvas{filter:drop-shadow(0 1px 1.2px rgba(0,0,0,.28))}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="pet"></div>
  <div id="bubble"><div class="box"></div></div>
</div>
<div id="bedroom"><canvas id="bedcanvas"></canvas></div>

<script>
const $ = (id) => document.getElementById(id);
const stage = $("stage"), bubble = $("bubble");
const BEDMODE = location.search.includes("bed");  // the same page draws the bedroom in its own window
const post = (msg) => { try { window.webkit.messageHandlers[BEDMODE ? "bed" : "pet"].postMessage(msg); } catch (_) {} };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rand = (lo, hi) => lo + Math.random() * (hi - lo);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const DPR = window.devicePixelRatio || 2;
const TAU = Math.PI * 2, RAD = Math.PI / 180;

// ---------- colour ----------
// Its colour follows its mood: how you've been using your Mac lately. Each mood also moves differently.
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const MOODS = {
  //        body       antenna light   bob  speed tilt  darts  eyes
  focused: { c: "#D97757", bud: "#FFC7A8", bob: 0.8, sp: 0.85, tilt: 1.2, dart: 0, eye: 0.82 },  // mostly in Claude
  bright:  { c: "#E3A23F", bud: "#FFE6A6", bob: 1.7, sp: 1.25, tilt: 2.5, dart: 0, eye: 1 },     // active, plenty left
  curious: { c: "#45B48F", bud: "#BFF2DE", bob: 1.2, sp: 1.1,  tilt: 7,   dart: 1, eye: 1.05 },  // hopping between apps
  calm:    { c: "#958DE0", bud: "#DEDAFF", bob: 1.3, sp: 0.6,  tilt: 4.5, dart: 0, eye: 0.7 },   // music on
  tired:   { c: "#8A8698", bud: "#D0CCDC", bob: 0.5, sp: 0.5,  tilt: 1,   dart: 0, eye: 0.58 },  // low usage or late
};
// A colour picked from the menu pins the look; "mood" lets it change.
const LOCKS = { clay: "focused", gold: "bright", mint: "curious", lavender: "calm" };
let mood = "bright", lock = null;
const target = () => MOODS[lock ? LOCKS[lock] : mood] || MOODS.bright;
// Colours blend through hue (so gold to mint passes through a clean yellow-green, not mud).
function toHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}
function fromHsl([h, s, l]) {
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function towards(cur, to, k) {
  let dh = to[0] - cur[0];
  if (dh > 180) dh -= 360;
  if (dh < -180) dh += 360;
  cur[0] = (cur[0] + dh * k + 360) % 360;
  cur[1] += (to[1] - cur[1]) * k;
  cur[2] += (to[2] - cur[2]) * k;
}
const live = { hc: toHsl(hex(MOODS.bright.c)), hb: toHsl(hex(MOODS.bright.bud)), c: hex(MOODS.bright.c), bud: hex(MOODS.bright.bud),
               bob: 1.7, sp: 1.25, tilt: 2.5, dart: 0, eye: 1 };
function ease(dt) {  // colours drift over a few seconds; the way it moves settles a little faster
  const T = target(), kc = 1 - Math.exp(-dt / 1.1), km = 1 - Math.exp(-dt / 0.9);
  towards(live.hc, toHsl(hex(T.c)), kc);
  towards(live.hb, toHsl(hex(T.bud)), kc);
  live.c = fromHsl(live.hc); live.bud = fromHsl(live.hb);
  for (const k of ["bob", "sp", "tilt", "dart", "eye"]) live[k] += (T[k] - live[k]) * km;
}
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, f) => c.map((v) => (f < 0 ? v * (1 + f) : v + (255 - v) * f));
const INK = "#1c1924", ROSE = "#EE7E96";

// ---------- state Swift drives ----------
let energy = 0.7, mode = "sit", busy = 0, token = 0, gear = "";
let look = 0, lookUp = 0, toldLook = [0, 0];
let fc = { eyes: "open", mouth: "none", arms: "down", blush: false, sweat: false };
let anim = null, animStart = 0, nervous = false;
let gapeLevel = 0, scaleOverride = null, chewOpen = false;
let shakeLevel = 0, focusP = null, focusDots = 0, bloomFrom = 0, bloomUntil = 0;
const SCALES = [2, 2, 3, 5];  // body size at each mouth level, in halves; Swift's mouthBody() matches

/** How much usage it has left to run on: hyper, ok, tired or sleepy. */
function vigor(e = energy) { return e >= 0.6 ? "hyper" : e >= 0.35 ? "ok" : e >= 0.15 ? "tired" : "sleepy"; }
const moving = () => ["walk", "run", "sneak", "fly", "jump"].includes(mode);

/** The resting face: calm, with no mouth. Only things you do to it bring out expressions. */
function base() {
  const m = vigor();
  if (mode === "fall") return { eyes: "wide", mouth: "o", arms: "up" };
  if (mode === "held") return { eyes: m === "sleepy" ? "half" : "happy", mouth: "w", arms: "up" };
  if (mode === "gape") return { eyes: "wide", mouth: gapeLevel >= 2 ? "yawn" : "o" };
  if (mode === "nap") return { eyes: "closed", mouth: "none" };
  if (m === "sleepy") return { eyes: moving() ? "half" : "closed", mouth: "none" };
  if (m === "tired") return { eyes: "half", mouth: "none" };
  return { eyes: "open", mouth: "none" };
}
function face(f) {
  const b = base();
  fc = { eyes: f.eyes || b.eyes, mouth: f.mouth || b.mouth, arms: f.arms || b.arms || "down", blush: !!f.blush, sweat: !!f.sweat };
  eyePop = performance.now();
}
/** One-shot moves, played out smoothly by the frame loop. */
function move(name) {
  anim = name || null;
  animStart = performance.now();
  if (name === "hop" || name === "pop") stemV += pick([-1, 1]) * 260;
  if (name === "squish") stemV += pick([-1, 1]) * 140;
}

/** Opens the flower on its antenna for a while (happy moments only). */
function bloom(ms = 5000) {
  const now = Date.now();
  if (vigor() === "sleepy") return;
  if (now > bloomUntil) {
    bloomFrom = now;
    for (let i = 0; i < 3; i++) fx("❀", "", { x: 50 + rand(-10, 10), y: 46, dx: rand(-14, 14), dy: rand(14, 24), delay: 150 + i * 120, dur: 1500 });
  }
  bloomUntil = Math.max(bloomUntil, now + ms);
}
function bloomTarget(now) {
  const m = vigor();
  let s = m === "sleepy" || now > bloomUntil ? 0 : m === "tired" ? 0.55 : 1;
  if (mode === "work" && focusP != null) s = Math.max(s, focusP >= 0.9 ? 1 : focusP >= 0.45 ? 0.55 : 0);
  return s;
}

// ---------- drawing the pet ----------
const cv = $("cv"), g = cv.getContext("2d");
let CW = 260, CH = 130;
function fit() {
  CW = window.innerWidth || 260; CH = window.innerHeight || 130;
  cv.width = CW * DPR; cv.height = CH * DPR;
  cv.style.width = CW + "px"; cv.style.height = CH + "px";
}
const W = 30, H = 27;  // body width and height at normal size (it's 34 across with its glow)

function bodyPath(c, w, h) {  // a soft gumdrop, origin at the bottom centre, up is negative
  c.beginPath();
  c.moveTo(0, -h);
  c.bezierCurveTo(w * 0.31, -h, w * 0.5, -h * 0.8, w * 0.5, -h * 0.45);
  c.bezierCurveTo(w * 0.5, -h * 0.13, w * 0.3, 0, 0, 0);
  c.bezierCurveTo(-w * 0.3, 0, -w * 0.5, -h * 0.13, -w * 0.5, -h * 0.45);
  c.bezierCurveTo(-w * 0.5, -h * 0.8, -w * 0.31, -h, 0, -h);
  c.closePath();
}
function capsule(c, x, y, w, h) {
  const r = Math.min(w, h) / 2;
  c.beginPath();
  c.moveTo(x - w / 2 + r, y - h / 2);
  c.arcTo(x + w / 2, y - h / 2, x + w / 2, y + h / 2, r);
  c.arcTo(x + w / 2, y + h / 2, x - w / 2, y + h / 2, r);
  c.arcTo(x - w / 2, y + h / 2, x - w / 2, y - h / 2, r);
  c.arcTo(x - w / 2, y - h / 2, x + w / 2, y - h / 2, r);
  c.closePath();
}
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * 0.42);
  c.bezierCurveTo(x - s * 0.62, y, x - s * 0.5, y - s * 0.58, x, y - s * 0.24);
  c.bezierCurveTo(x + s * 0.5, y - s * 0.58, x + s * 0.62, y, x, y + s * 0.42);
  c.closePath();
}
function roundRect(c, x, y, w, h, r) { capsule(c, x + w / 2, y + h / 2, w, h); if (r < Math.min(w, h) / 2) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); } }

let eyePop = 0, blinkAt = performance.now() + 2500, dartAt = 0, dart = [0, 0];
const sm = { k: 1, hover: 3, lean: 0, lx: 0, ly: 0, flower: 0, bud: 0, crouch: 1, tilt: 0, tiltTo: 0, tiltAt: 0 };
let stem = 0, stemV = 0, lastT = performance.now(), clock = 0;

/** Eyes at (x, y) in body units. */
function eye(c, kind, x, y, open, side) {
  c.fillStyle = INK; c.strokeStyle = INK; c.lineCap = "round"; c.lineWidth = 1.3;
  switch (kind) {
    case "closed":
      c.beginPath(); c.moveTo(x - 2.3, y); c.quadraticCurveTo(x, y + 2.1, x + 2.3, y); c.stroke(); return;
    case "happy":
      c.beginPath(); c.moveTo(x - 2.3, y + 1.2); c.quadraticCurveTo(x, y - 2.4, x + 2.3, y + 1.2); c.stroke(); return;
    case "heart":
      c.fillStyle = ROSE; heartPath(c, x, y, 6.4); c.fill(); return;
    case "dizzy": {
      c.lineWidth = 0.95; c.beginPath();
      for (let a = 0; a <= TAU * 1.6; a += 0.25) {
        const r = 0.3 + a * 0.36, s = side * (clock * 7);
        c.lineTo(x + Math.cos(a * side + s) * r, y + Math.sin(a * side + s) * r);
      }
      c.stroke(); return;
    }
  }
  let w = 3.6, h = 7;
  if (kind === "wide") { w = 4.3; h = 8.1; }
  if (kind === "half") { h = 3.6; y += 1.7; }
  const shut = h * (1 - open);
  h = Math.max(1.1, h - shut);
  y += shut * (kind === "half" ? 0 : 0.5) * (open > 0.6 ? 1 : 0.4);
  capsule(c, x, y, w, h); c.fill();
  if (h > 3.2) { c.fillStyle = "rgba(255,255,255,.85)"; c.beginPath(); c.arc(x + w * 0.2, y - h * 0.24, 0.72, 0, TAU); c.fill(); }
}
function mouth(c, kind) {
  c.fillStyle = INK; c.strokeStyle = INK; c.lineCap = "round"; c.lineWidth = 1.1;
  const y = -H * 0.29;
  switch (kind) {
    case "w": c.beginPath(); c.moveTo(-2, y - 0.6); c.quadraticCurveTo(0, y + 1.4, 2, y - 0.6); c.stroke(); break;
    case "o": c.beginPath(); c.ellipse(0, y, 1.45, 1.75, 0, 0, TAU); c.fill(); break;
    case "d":
      c.beginPath(); c.moveTo(-2.6, y - 0.9); c.lineTo(2.6, y - 0.9); c.ellipse(0, y - 0.9, 2.6, 2.7, 0, 0, Math.PI); c.fill();
      c.fillStyle = ROSE; c.beginPath(); c.ellipse(0, y + 1.1, 1.3, 0.6, 0, 0, TAU); c.fill(); break;
    case "flat": c.beginPath(); c.moveTo(-1.8, y); c.lineTo(1.8, y); c.stroke(); break;
    case "yawn":
      c.beginPath(); c.ellipse(0, y - 0.2, 2, 2.9, 0, 0, TAU); c.fill();
      c.fillStyle = ROSE; c.beginPath(); c.ellipse(0, y + 1.6, 1.1, 0.6, 0, 0, TAU); c.fill(); break;
  }
}
function arm(c, side, deg, col) {
  c.save();
  c.translate(side * W * 0.45, -H * 0.5);
  c.rotate(side * deg * RAD);
  c.fillStyle = col; capsule(c, 0, -4, 3.4, 8.4); c.fill();
  c.restore();
}

/** The antenna: a little stem on a spring with a light at the tip, which opens into a flower when it's happy. */
function antenna(c, angle, bud, col, flower, glow) {
  const L = 6.4, bx = 0, by = -H + 0.8, a = angle * RAD;
  const tx = bx + Math.sin(a) * L, ty = by - Math.cos(a) * L;
  const qx = bx + Math.sin(a * 0.35) * L * 0.55, qy = by - Math.cos(a * 0.35) * L * 0.55;
  c.strokeStyle = rgb(shade(col, -0.18)); c.lineWidth = 1.5; c.lineCap = "round";
  c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(qx, qy, tx, ty); c.stroke();
  if (flower > 0.02) {
    const r = 1.1 + flower * 0.9, off = 1.4 + flower * 1.4;
    c.fillStyle = "#F6B6C8";
    for (let i = 0; i < 5; i++) {
      const p = a + (i / 5) * TAU + clock * 0.3;
      c.beginPath(); c.ellipse(tx + Math.sin(p) * off, ty - Math.cos(p) * off, r, r * 0.8, p, 0, TAU); c.fill();
    }
  }
  c.save();
  c.shadowColor = rgb(bud, 0.9); c.shadowBlur = glow * DPR;
  c.fillStyle = flower > 0.5 ? "#FFE29A" : rgb(bud);
  c.beginPath(); c.arc(tx, ty, 2.2 * (1 - flower * 0.15), 0, TAU); c.fill();
  c.restore();
}

/** The whole creature at the origin (its bottom centre). Shared with the bedroom's sleeper. */
function creature(c, o) {
  const col = live.c;
  // arms float behind the body and only show when it gestures
  if (o.arms === "up") { arm(c, -1, 38, rgb(shade(col, -0.1))); arm(c, 1, 38, rgb(shade(col, -0.1))); }
  if (o.arms === "wave") arm(c, 1, 30 + 28 * Math.sin(clock * TAU * 2.6), rgb(shade(col, -0.1)));
  antenna(c, o.stem, live.bud, col, o.flower, o.glow);
  // body: a soft colour with a little light of its own
  c.save();
  c.shadowColor = rgb(col, 0.32 + 0.1 * o.breath); c.shadowBlur = 4 * DPR;
  bodyPath(c, W, H); c.fillStyle = rgb(col); c.fill();
  c.restore();
  const hl = c.createRadialGradient(-W * 0.17, -H * 0.76, 0, -W * 0.17, -H * 0.76, W * 0.6);
  hl.addColorStop(0, "rgba(255,255,255,.42)"); hl.addColorStop(1, "rgba(255,255,255,0)");
  bodyPath(c, W, H); c.fillStyle = hl; c.fill();
  const lo = c.createLinearGradient(0, -H * 0.4, 0, 0);
  lo.addColorStop(0, "rgba(30,10,40,0)"); lo.addColorStop(1, "rgba(30,10,40,.16)");
  c.fillStyle = lo; c.fill();
  c.lineWidth = 0.6; c.strokeStyle = "rgba(25,15,35,.22)"; c.stroke();

  // face
  const ey = -H * 0.5 + o.ly;
  if (o.big) {
    c.fillStyle = "#2a1621"; c.beginPath(); c.ellipse(0, -H * 0.33, W * 0.31, H * 0.23, 0, 0, TAU); c.fill();
    c.fillStyle = ROSE; c.beginPath(); c.ellipse(0, -H * 0.17, W * 0.15, H * 0.065, 0, 0, TAU); c.fill();
    eye(c, "happy", -5.6, -H * 0.7, 1, -1); eye(c, "happy", 5.6, -H * 0.7, 1, 1);
  } else {
    if (o.blush) {
      c.fillStyle = "rgba(240,110,140,.42)";
      for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * 8, -H * 0.36, 2.1, 1.2, 0, 0, TAU); c.fill(); }
    }
    const L = o.eyes === "wink" ? "open" : o.eyes, R = o.eyes === "wink" ? "happy" : o.eyes;
    eye(c, L, -5.2 + o.lx, ey, o.open, -1);
    eye(c, R, 5.2 + o.lx, ey, o.open, 1);
    mouth(c, o.mouth);
  }
  if (o.gear === "glasses") {
    c.strokeStyle = INK; c.lineWidth = 0.9;
    for (const s of [-1, 1]) { c.beginPath(); c.arc(s * 5.2 + o.lx * 0.5, ey, 3.5, 0, TAU); c.stroke(); }
    c.beginPath(); c.moveTo(-1.7, ey - 0.5); c.quadraticCurveTo(0, ey - 1.6, 1.7, ey - 0.5); c.stroke();
  } else if (o.gear === "phones") {
    c.strokeStyle = INK; c.lineWidth = 1.7;
    c.beginPath(); c.arc(0, -H * 0.5, W * 0.53, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    for (const s of [-1, 1]) {
      c.fillStyle = "#2a2633"; capsule(c, s * (W * 0.5 - 0.3), -H * 0.48, 4, 8.4); c.fill();
      c.fillStyle = rgb(live.bud); c.beginPath(); c.arc(s * (W * 0.5 - 0.3), -H * 0.48, 0.8, 0, TAU); c.fill();
    }
  }
  if (o.sweat) {
    const y = -H * 0.95 + ((clock * 3) % 1) * 3;
    c.fillStyle = "#A9D8F3";
    c.beginPath(); c.moveTo(W * 0.42, y - 2.6); c.quadraticCurveTo(W * 0.42 + 2, y + 0.4, W * 0.42, y + 1.2);
    c.quadraticCurveTo(W * 0.42 - 2, y + 0.4, W * 0.42, y - 2.6); c.fill();
  }
}

/** Its laptop for focus sessions: a progress line along the desk fills as the session goes. */
function desk(c, t) {
  c.fillStyle = "rgba(214,206,198,.96)"; roundRect(c, -24, -1.6, 48, 2.8, 1.3); c.fill();
  c.fillStyle = "rgba(255,255,255,.22)"; roundRect(c, -20, -0.7, 40, 1, 0.5); c.fill();
  c.fillStyle = rgb(live.c); roundRect(c, -20, -0.7, 40 * clamp(focusP || 0, 0, 1), 1, 0.5); c.fill();
  c.fillStyle = "#c4c0ca"; roundRect(c, -12, -3.4, 24, 2, 1); c.fill();
  const lid = c.createLinearGradient(0, -11.6, 0, -3.2);
  lid.addColorStop(0, "#ebe8ef"); lid.addColorStop(1, "#cdc9d4");
  c.fillStyle = lid; roundRect(c, -9.5, -11.6, 19, 8.6, 1.6); c.fill();
  c.save(); c.shadowColor = rgb(live.bud, 0.9); c.shadowBlur = 2 * DPR;
  c.fillStyle = rgb(live.bud); c.beginPath(); c.arc(0, -7.4, 1, 0, TAU); c.fill(); c.restore();
  for (const s of [-1, 1]) {  // paws taking turns on the keys
    const tap = Math.max(0, Math.sin(t * TAU / 0.52 + (s > 0 ? Math.PI : 0))) * 1.3;
    c.fillStyle = rgb(shade(live.c, -0.1)); capsule(c, s * 6.6, -11.6 - tap, 3, 3.6); c.fill();
  }
}

/** One-shot moves: offsets, tilt and squash at time t (ms) into the move. */
function oneShot(t) {
  const o = { dx: 0, dy: 0, rot: 0, sx: 1, sy: 1, arms: null, pivot: "base" };
  const settle = (t0, amp, per) => { const u = t - t0; return u < 0 ? 0 : amp * Math.exp(-u / (per * 0.45)) * Math.cos(TAU * u / per); };
  const jump = (h, air) => {
    if (t < 70) { const s = t / 70; o.sy = 1 - 0.12 * s; o.sx = 1 + 0.08 * s; return; }
    if (t < 70 + air) { const u = (t - 70) / air; o.dy = -h * Math.sin(Math.PI * u); o.sy = 1 + 0.09 * Math.cos(Math.PI * u); o.sx = 2 - o.sy; return; }
    const q = settle(70 + air, -0.12, 300); o.sy = 1 + q; o.sx = 1 - q * 0.8;
  };
  switch (anim) {
    case "squish": { const q = settle(0, -0.14, 320); o.sy = 1 + q; o.sx = 1 - q * 0.8; break; }
    case "hop": jump(11, 380); break;
    case "pop": jump(16, 440); if (t < 600) { const b = 1 + 0.06 * Math.sin(Math.PI * clamp(t / 600, 0, 1)); o.sx *= b; o.sy *= b; } break;
    case "wiggle": if (t < 900) o.rot = 9 * Math.sin(TAU * t / 200) * (1 - t / 900); break;
    case "lean": if (t < 1100) { o.rot = 8 * Math.sin(TAU * t / 560) * (1 - t / 1100); o.dx = o.rot * 0.15; } break;
    case "shake": if (t < 840) o.dx = 2.2 * Math.sin(TAU * t / 95) * (1 - t / 840); break;
    case "spin": if (t < 900) { const u = t / 900, e = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u); o.sx = Math.cos(TAU * 2 * e); o.dy = -5 * Math.sin(Math.PI * u); } break;
    case "tumble": {
      o.pivot = "mid";
      if (t < 760) { const u = t / 760; o.rot = 360 * (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2); o.dy = -6 * Math.sin(Math.PI * u); }
      else o.rot = settle(760, 8, 380);
      break;
    }
    case "dance": if (t < 2200) { o.rot = 9 * Math.sin(TAU * t / 560); o.dy = -2.2 * Math.abs(Math.sin(TAU * t / 560)); o.arms = "wave"; } break;
    case "stretch": if (t < 1200) { const s = Math.sin(Math.PI * t / 1200); o.sy = 1 + 0.12 * s; o.sx = 1 - 0.07 * s; if (s > 0.3) o.arms = "up"; } break;
    case "woozy": if (t < 2300) { o.rot = 7 * Math.sin(TAU * t / 900); o.dx = 2 * Math.sin(TAU * t / 900 + 1); } break;
  }
  return o;
}

function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - lastT) / 1000);
  lastT = nowMs; clock += dt;
  ease(dt);
  const now = Date.now(), t = nowMs - animStart, sp = live.sp, v = vigor();
  if (anim && t > 2400) anim = null;
  const a = anim ? oneShot(t) : oneShot(-1);

  // where it hovers, how it leans, how it breathes: by what it's doing, coloured by its mood
  let hover = 3, lean = 0, bob = live.bob, per = 2.6 / sp, crouch = 1, sx = 1, sy = 1, stemTo = 0, grounded = true;
  switch (mode) {
    case "walk": lean = look * 5; bob = 1.1; per = 0.5; stemTo = -look * 12; break;
    case "run": lean = look * 9; bob = 1.6; per = 0.32; stemTo = -look * 20; break;
    case "sneak": hover = 1; crouch = 0.9; lean = look * 3; bob = 0.6; per = 0.9; stemTo = -look * 8; break;
    case "fly": lean = look * 11; bob = 1.4; per = 0.75; stemTo = -look * 34; sx = 0.97; sy = 1.03; grounded = false; break;
    case "fall": sx = 0.91; sy = 1.1; bob = 0; stemTo = 8 * Math.sin(clock * 30); grounded = false; break;
    case "jump": sx = 0.95; sy = 1.06; bob = 0; stemTo = -look * 16; grounded = false; break;
    case "held": bob = 0; grounded = false; break;
    case "nap": hover = 0.4; crouch = 0.93; bob = 0.5; per = 3.4; stemTo = 95; break;
    case "work": hover = 0.6; bob = 0.35; per = 2; break;
    case "gape": hover = 1.5; bob = 0.5; per = 1.2; break;
    case "peek-l": case "peek-r": { const s = mode === "peek-l" ? -1 : 1; lean = s * 7; hover = 1.5; bob = 0.5; break; }
  }
  if (mode === "sit" || mode === "work" || mode === "gape") {
    if (v === "sleepy") { hover = 1; per = 3.4; bob = 0.6; stemTo = 95; }
    else if (v === "tired" || mood === "tired") stemTo = 50;
    else if (v === "hyper") stemTo = 10 * Math.sin(clock * 2.4 * sp);
    else stemTo = 3 * Math.sin(clock * 1.3);
  }
  if (mode === "nap") stemTo = 95;
  if (mode === "fly" || mode === "walk" || mode === "run") stemTo += 4 * Math.sin(clock * 9);

  // a head tilt now and then (curious ones tilt more), and a slow sway when it's calm
  if (mode === "sit" && nowMs > sm.tiltAt) { sm.tiltTo = Math.random() < 0.5 ? 0 : rand(-1, 1) * live.tilt; sm.tiltAt = nowMs + rand(1800, 4200) / sp; }
  if (mode !== "sit") sm.tiltTo = 0;
  sm.tilt += (sm.tiltTo - sm.tilt) * (1 - Math.exp(-dt * 3));
  const sway = mode === "sit" ? Math.sin(clock * 0.9 * sp) * live.tilt * 0.35 : 0;

  const k1 = 1 - Math.exp(-dt * 9), k2 = 1 - Math.exp(-dt * 14);
  sm.hover += (hover - sm.hover) * k1; sm.lean += (lean - sm.lean) * k1; sm.crouch += (crouch - sm.crouch) * k1;
  const kTo = (scaleOverride ?? (mode === "gape" ? SCALES[gapeLevel] : 2)) / 2;
  sm.k += (kTo - sm.k) * k2;
  sm.flower += (bloomTarget(now) - sm.flower) * (1 - Math.exp(-dt * 5));

  // the antenna: a damped spring chasing where it wants to point
  const w = 15, z = 0.32;
  stemV += (w * w * (stemTo - stem) - 2 * z * w * stemV) * dt; stem += stemV * dt;

  // eyes: follow the cursor, blink, and (when curious) dart about on their own
  if (live.dart > 0.5 && mode === "sit" && toldLook[0] === 0 && nowMs > dartAt) { dart = [rand(-1.6, 1.6), rand(-0.8, 0.4)]; dartAt = nowMs + rand(500, 1500); }
  if (live.dart <= 0.5 || toldLook[0] !== 0) dart = [0, 0];
  const peeking = mode.startsWith("peek");
  sm.lx += ((peeking ? (mode === "peek-l" ? -1.4 : 1.4) : look * 1.6 + dart[0]) - sm.lx) * k2;
  sm.ly += ((lookUp && !peeking ? -1.2 : dart[1]) - sm.ly) * k2;
  let eyes = fc.eyes, mouthKind = fc.mouth, sweat = fc.sweat, arms = a.arms || fc.arms;
  let open = eyes === "open" ? Math.min(1, live.eye) : 1;
  const b = nowMs - blinkAt;
  if (b > 0 && (eyes === "open" || eyes === "wide")) {
    if (b < 150) open *= Math.abs(1 - b / 75) * 0.92 + 0.08;
    else blinkAt = nowMs + rand(2400, 5600) / Math.max(0.6, sp);
  }
  const pop = nowMs - eyePop;
  if (pop < 160) open *= 0.55 + 0.45 * (pop / 160);  // a quick soft change of expression

  // shaken about while held: it sloshes like jelly
  let shear = 0, hold = 0;
  if (mode === "held") {
    hold = 10 * Math.sin(clock * TAU / 1.15);
    if (shakeLevel > 0) {
      shear = Math.sin(clock * TAU * [0, 4.5, 6.5, 8.5][shakeLevel]) * 0.12 * shakeLevel;
      eyes = shakeLevel >= 2 ? "dizzy" : "wide"; mouthKind = shakeLevel === 3 ? "yawn" : "o"; sweat = shakeLevel === 3;
    }
  }
  if (nervous) a.dx += Math.sin(clock * 70) * 0.5;

  const breath = Math.sin(clock * TAU / per);
  const bobY = -(breath * 0.5 + 0.5) * bob;
  const k = sm.k;
  const bsx = (1 + 0.012 * breath) * sx * a.sx, bsy = (1 - 0.012 * breath) * sy * a.sy * sm.crouch;

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, CW, CH);
  const gx = 130, gy = CH - 6;
  if (grounded) {  // a soft shadow under it, smaller the higher it floats
    const lift = sm.hover - bobY - a.dy, f = clamp(1 - lift / 26, 0.4, 1);
    g.fillStyle = `rgba(0,0,0,${0.2 * f})`;
    g.beginPath(); g.ellipse(gx + a.dx, gy + 0.6, 11 * k * f, 1.7 * f, 0, 0, TAU); g.fill();
  }
  g.save();
  g.translate(gx + a.dx, gy - sm.hover + bobY + a.dy);
  if (mode === "held") { g.translate(0, -H * k); g.rotate(hold * RAD); g.translate(0, H * k); }
  if (a.pivot === "mid") { g.translate(0, -H * k / 2); g.rotate(a.rot * RAD); g.translate(0, H * k / 2); }
  else g.rotate((a.rot + sm.lean + sm.tilt + sway) * RAD);
  if (shear) g.transform(1, 0, shear, 1, 0, 0);
  g.scale(k * bsx, k * bsy);
  creature(g, {
    eyes, mouth: mouthKind, arms, blush: fc.blush, sweat, gear, open, lx: sm.lx, ly: sm.ly,
    big: chewOpen || (mode === "gape" && gapeLevel === 3 && !busy),
    stem: stem + (a.rot ? -a.rot * 0.6 : 0), flower: sm.flower, glow: 3 + breath, breath,
  });
  g.restore();
  if (mode === "work" && focusP != null) { g.save(); g.translate(gx, gy); desk(g, clock); g.restore(); }

  if (bubble.classList.contains("show")) layoutBubble();
}

function loop(t) { frame(t); requestAnimationFrame(loop); }

};
function fx(text, cls, { x = 50, y = 46, dx = 0, dy = 24, dur = 1300, delay = 0 } = {}) {
  const el = document.createElement("span");
  el.className = "fx";
  const art = ART[text] || ART[{ "♫": "♪" }[text]];
  if (art) el.innerHTML = art;
  else { el.textContent = text; el.classList.add(cls === "zz" ? "zz" : "mark"); }
  if (cls === "bang") el.style.fontSize = "13px";
  el.style.left = x + 80 + "px";  // x is measured from the left of a 100px-wide box around the pet
  el.style.bottom = y + "px";
  stage.appendChild(el);
  // at home the menu bar hides anything floating up, so drift left instead
  if (stage.classList.contains("home")) { dx = -Math.abs(dy) - 6; dy = dy * 0.25; }
  el.animate([
    { transform: "translate(-50%, 0) scale(.6)", opacity: 0 },
    { transform: `translate(calc(-50% + ${dx * 0.25}px), ${-dy * 0.25}px) scale(1)`, opacity: 1, offset: 0.22 },
    { transform: `translate(calc(-50% + ${dx * 0.8}px), ${-dy * 0.8}px) scale(1)`, opacity: 0.9, offset: 0.75 },
    { transform: `translate(calc(-50% + ${dx}px), ${-dy}px) scale(.9)`, opacity: 0 },
  ], { duration: dur, delay, easing: "cubic-bezier(.25,.7,.35,1)", fill: "both" }).onfinish = () => el.remove();
}

function layoutBubble() {
  const k = sm.k, home = stage.classList.contains("home");
  const right = home ? 130 + 17 * k + 8 + "px" : "auto", bottom = home ? Math.round(6 + 10 * k) + "px" : Math.round(6 + sm.hover + (H + 12) * k + 4) + "px";
  if (bubble.style.right !== right) bubble.style.right = right;
  if (bubble.style.bottom !== bottom) bubble.style.bottom = bottom;
  if (!home && bubble.style.left !== "50%") bubble.style.left = "50%";
  if (home && bubble.style.left !== "auto") bubble.style.left = "auto";
}
let bubbleTimer = 0;
function say(text, ms = 1400) {
  bubble.querySelector(".box").textContent = text;
  layoutBubble();
  bubble.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove("show"), ms);
}

/** Runs [delay ms, fn] steps; a newer reaction cancels the rest of an older one. */
function play(name, steps, total) {
  const my = ++token;
  scaleOverride = null;
  chewOpen = false;
  busy = Date.now() + total;
  let t = 0;
  for (const [delay, fn] of steps) { t += delay; setTimeout(() => { if (my === token) fn(); }, t); }
  setTimeout(() => {
    if (my !== token) return;
    busy = 0;
    scaleOverride = null;
    face({});
    move("");
    post({ cmd: "done", name });
  }, total);
}

    play("focusStop", [[0, () => {
      face({ eyes: "happy", mouth: "w" });
      say(Number(min) >= 1 ? `nice, ${min} min` : "next time", 2000);
    }]], 2200);
  },

  // Woken up and turfed out of bed.
  grumpy() {
    play("grumpy", [
      [0, () => { face({ eyes: "half", mouth: "flat" }); move("stretch"); say(pick(["five more minutes…", "mm… so sleepy", "nngh…"]), 1800); }],
      [1600, () => { face({ eyes: "closed", mouth: "yawn" }); fx("z", "zz", { x: 62, y: 36, dx: 8, dy: 16, dur: 1600 }); }],
      [900, () => { face({ eyes: "half", mouth: "flat" }); }],
    ], 3000);
  },

  // Starting to find the desktop interesting.
  wonder() {
    play("wonder", [[0, () => {
      face({ eyes: "wide" }); fx("?", "bang", { dy: 12, dur: 800 });
      if (Math.random() < 0.5) say(pick(["hm?", "what's this?", "ooh", "interesting"]), 1100);
    }]], 900);
  },

  bedtime() {
    play("bedtime", [[0, () => { face({ eyes: "closed", mouth: "yawn" }); move("stretch"); say(pick(["bedtime", "sleepy…", "night night"]), 1500); }]], 1600);
  },

  found() { FOUND[nextFound()](); },

  // You've gone quiet: it looks round for you, then curls up for a nap.
  nodoff() {
    play("nodoff", [
      [0, () => { face({ eyes: "open" }); look = -1; }],
      [700, () => { look = 1; }],
      [700, () => { look = 0; face({ eyes: "half" }); fx("?", "bang", { dy: 10, dur: 800 }); }],
      [700, () => { face({ eyes: "closed", mouth: "yawn" }); move("stretch"); }],
    ], 2600);
  },

  // Woken from that nap by you moving the mouse or typing.
  stir() {
    play("stir", [
      [0, () => { face({ eyes: "half" }); move("squish"); }],
      [400, () => { face({ eyes: "wide", mouth: "o" }); fx("!", "bang", { dy: 12, dur: 700 }); }],
      [450, () => { face({ eyes: "happy", mouth: "w" }); if (Math.random() < 0.6) say(pick(["oh, hi", "mm? hi", "you're here"]), 1100); }],
    ], 1700);
  },

  // You're back: a little wave after a short break, a big hello after hours, good morning on a new day.
  welcome(kind) {
    const sleepy = vigor() === "sleepy";
    if (kind === "focus") {
      return play("welcome", [[0, () => { face({ eyes: "happy", mouth: "w" }); say(pick(["welcome back", "still here with you", "back to it?"]), 2000); }]], 2200);
    }
    if (kind === "small") {
      return play("welcome", [
        [0, () => { face({ eyes: "wide", mouth: "o" }); move("squish"); }],
        [400, () => { face({ eyes: "happy", mouth: "w", arms: "wave" }); say(pick(["oh, hi", "welcome back", "hi again"]), 1500); }],
      ], 2100);
    }
    if (kind === "mid") {
      return play("welcome", [
        [0, () => { face({ eyes: "wide", mouth: "o" }); fx("!", "bang", { dy: 12, dur: 700 }); }],
        [450, () => {
          face({ eyes: "happy", mouth: "d", arms: "wave", blush: true }); move("hop"); bloom(4000); fx("♥", "", { dy: 22 });
          say(sleepy ? "mm… you're back" : pick(["you're back", "there you are", "welcome back"]), 1800);
        }],
      ], 2700);
    }
    if (kind === "morning") {
      return play("welcome", [
        [0, () => { face({ eyes: "closed", mouth: "yawn", arms: "up" }); move("stretch"); }],
        [1300, () => {
          face({ eyes: "happy", mouth: "d", arms: "up", blush: true }); move("hop"); bloom(9000);
          say(pick(["good morning", "morning", "morning ✦"]), 1700);
          for (let i = 0; i < 4; i++) fx(i % 2 ? "✦" : "❀", "", { x: 50 + rand(-22, 22), dx: rand(-12, 12), dy: rand(16, 28), delay: 150 + i * 130 });
        }],
        [1900, () => { face({ eyes: "half", mouth: "w" }); say(pick(["have a good day", "five more minutes…", "let's have a good one"]), 1300); }],
      ], 4500);
    }
    // gone for hours
    return play("welcome", [
      [0, () => { face({ eyes: "wide", mouth: "o", arms: "up" }); move("pop"); fx("!", "bang", { dy: 14, dur: 800 }); }],
      [500, () => {
        face({ eyes: "heart", mouth: "d", arms: "up", blush: true }); move("hop"); bloom(9000);
        say(pick(["you're back", "missed you", "there you are"]), 1800);
        for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU; fx("♥", "", { dx: Math.cos(a) * 24, dy: 14 + Math.sin(a) * 16, delay: i * 80, dur: 1400 }); }
      }],
      [1900, () => { face({ eyes: "happy", mouth: "w", arms: "wave" }); say(pick(["missed you", "welcome home", "good to see you"]), 1700); }],
    ], 4500);
  },

  // Late at night: a yawn and a gentle hint, a little more pointed as it gets later.
  nightNudge(h) {
    const hr = Number(h);
    const line = hr >= 23 ? pick(["getting late", "sleep soon?", "almost bedtime"])
      : hr < 2 ? pick(["it's so late", "rest soon?", "go rest, okay?"])
      : pick(["really late now", "please sleep soon", "still up?"]);
    play("nightNudge", [
      [0, () => { face({ eyes: "closed", mouth: "yawn" }); move("stretch"); }],
      [1300, () => { face({ eyes: "half", mouth: "w" }); say(line, 2000); fx("z", "zz", { x: 62, y: 36, dx: 8, dy: 16, dur: 1600 }); }],
    ], 3400);
  },
};

// Found-while-hiding reactions: dealt from a shuffled bag so each one shows up before any repeats.
const FOUND = [
  () => play("found", [
    [0, () => { face({ eyes: "wide", mouth: "d", arms: "up" }); move("pop"); say("boo", 1100); }],
    [1000, () => { face({ eyes: "happy", mouth: "d" }); move("shake"); say("hehe", 1000); }],
  ], 2400),
  () => play("found", [
    [0, () => { face({ eyes: "wide", mouth: "o" }); move("hop"); fx("!", "bang", { dy: 14, dur: 900 }); }],
    [550, () => { face({ eyes: "closed", mouth: "w", arms: "up", blush: true, sweat: true }); move("shake"); say("eep", 1300); }],
  ], 2400),
  () => play("found", [
    [0, () => { face({ eyes: "happy", mouth: "d", arms: "up" }); move("spin"); bloom(5000);
      for (let i = 0; i < 5; i++) fx("✦", "", { x: 50 + rand(-26, 26), y: 34 + rand(-10, 26), dx: rand(-12, 12), dy: rand(8, 22), delay: 200 + i * 100 }); }],
    [750, () => { say("ta-da", 1300); }],
  ], 2300),
  () => play("found", [
    [0, () => { face({ eyes: "heart", mouth: "d", blush: true }); move("pop"); say("found me", 1500); bloom(5000);
      for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU; fx("♥", "", { dx: Math.cos(a) * 24, dy: 14 + Math.sin(a) * 16, delay: i * 80, dur: 1400 }); } }],
  ], 2300),
  () => play("found", [
    [0, () => { face({ eyes: "dizzy", mouth: "o" }); move("tumble"); }],
    [300, () => { for (let i = 0; i < 3; i++) fx("✦", "", { x: 38 + i * 12, y: 44, dx: rand(-6, 6), dy: 8, delay: i * 160, dur: 1000 }); say("whoa", 1000); }],
    [1300, () => { face({ eyes: "happy", mouth: "d" }); say("okay, you win", 1300); }],
  ], 2700),
  () => play("found", [
    [0, () => { face({ eyes: "happy", mouth: "w", arms: "wave" }); move("dance"); say("la la", 1800);
      ["♪", "♫", "♪", "♫"].forEach((n, i) => fx(n, "", { x: 50 + rand(-24, 24), dx: rand(-10, 10), dy: rand(18, 30), delay: i * 380, dur: 1500 })); }],
  ], 2400),
];
let bag = [], lastFound = -1;
function nextFound() {
  if (!bag.length) {
    bag = FOUND.map((_, i) => i).sort(() => Math.random() - 0.5);
    if (bag[bag.length - 1] === lastFound) bag.unshift(bag.pop());  // no repeat across bags either
  }
  return (lastFound = bag.pop());
}

// ---------- what Swift calls ----------
window.P = {
  energy(e) {
    energy = Math.max(0, Math.min(1, e));
    if (!busy) face({});
  },
  mode(m) {
    mode = m;
    if (!m.startsWith("peek")) nervous = false;
    if (m === "held" && Math.random() < 0.5) say("wheee", 900);
    if (!busy) face({});
  },
  look(d, up = 0) { toldLook = [d, up]; look = d; lookUp = up; },
  home(on) { stage.classList.toggle("home", on); layoutBubble(); },
  shake(n) {
    const prev = shakeLevel;
    shakeLevel = n;
    if (n === 1 && prev === 0) say(pick(["whoa", "hey", "eek"]), 700);
    if (n === 3 && prev < 3) say(pick(["too much", "stop", "bleh"]), 900);
  },
  gape(level) {
    const prev = gapeLevel;
    gapeLevel = level;
    if (!busy) face({});
    if (level === 1 && prev === 0) say(pick(["food?", "for me?", "ooh"]), 900);
    if (level === 3 && prev < 3) say("aah", 700);
  },
  near(on) { nervous = on && mode.startsWith("peek"); },
  mood(m) { if (MOODS[m]) mood = m; },
  theme(t) { lock = LOCKS[t] ? t : null; },
  gear(gr) { gear = gr; },
  focus(p) {
    focusP = p;
    // a tiny sparkle each time another tenth goes by
    const dots = p == null ? 0 : Math.floor(p * 10 + 1e-6);
    if (p != null && dots > focusDots) fx("✦", "", { x: 50 + (dots - 5) * 3, y: 8, dy: 10, dur: 900 });
    focusDots = dots;
  },
  // "name" or "name:argument"
  react(name) {
    const [n, ...rest] = name.split(":");
    (R[n] || (() => post({ cmd: "done", name })))(rest.join(":"));
  },
};

if (!BEDMODE) document.addEventListener("mousedown", (e) => { if (e.button === 0) post({ cmd: "down" }); });

// Little things it does on its own while sitting or hiding, a bit different in each mood.
setInterval(() => {
  if (busy || BEDMODE) return;
  const m = vigor(), r = Math.random();
  if (mode === "nap") {
    if (r < 0.8) fx("z", "zz", { x: 62, y: 34, dx: 8, dy: 20, dur: 2200 });
  } else if (mode === "sit") {
    if (m === "sleepy") { fx("z", "zz", { x: 62, y: 38, dx: 8, dy: 20, dur: 2200 }); return; }
    if (r < 0.07 && toldLook[0] === 0 && toldLook[1] === 0) {  // only when it isn't watching the cursor
      look = -1;
      setTimeout(() => { if (mode === "sit") look = 1; }, 900);
      setTimeout(() => { look = toldLook[0]; }, 1800);
    } else if ((m === "tired" || mood === "tired") && r < 0.09) R.yawn();
    else if (mood === "bright" && r > 0.95) move("squish");
  } else if (mode.startsWith("peek") && r < 0.08) {
    move("squish");
  }
}, 1300);

// A file held over its open mouth: little streaks of air rushing in.
function gust() {
  const px = 30 * sm.k, cx = 130, cy = 6 + px * 0.42;
  const a = rand(0, TAU), r = rand(px * 0.6, px * 0.9);
  const x0 = Math.cos(a) * r, y0 = Math.sin(a) * r;
  const el = document.createElement("span");
  el.className = "fx";
  el.style.cssText = `left:${cx + x0}px;bottom:${cy + y0}px;width:7px;height:1.5px;border-radius:1px;background:rgba(255,255,255,.9);box-shadow:0 0 0 .5px rgba(40,30,60,.25)`;
  stage.appendChild(el);
  el.animate([
    { transform: `translate(0, 0) rotate(${-a}rad)`, opacity: 0 },
    { opacity: 0.9, offset: 0.3 },
    { transform: `translate(${-x0}px, ${y0}px) rotate(${-a}rad)`, opacity: 0 },
  ], { duration: 380, easing: "ease-in" }).onfinish = () => el.remove();
}
setInterval(() => { if (mode === "gape" && gapeLevel >= 2 && !busy) gust(); }, 90);

// ---------- the bedroom (pet.html?bed): a little bed in the top-right corner ----------
// The window is 80×66; the pet's head rests on the pillow at (45, 21) from its bottom left, which is
// where Swift puts it when it sits up.
let bedOccupied = true, bedSky = "night", bedStir = 0, bctx, BW = 80, BH = 66;

function drawBed(nowMs = performance.now()) {
  const c = bctx, now = Date.now(), t = nowMs / 1000;
  ease(1 / 15);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, BW, BH);
  c.translate(0, BH); c.scale(1, -1);  // y up from the bottom, like Swift

  // the sky above it: a crescent moon and two stars at night, a small sun by day
  c.save();
  if (bedSky === "day") {
    c.fillStyle = "#F7C65B"; c.beginPath(); c.arc(10, 56, 3.4, 0, TAU); c.fill();
    c.strokeStyle = "rgba(247,198,91,.7)"; c.lineWidth = 0.8; c.lineCap = "round";
    for (let i = 0; i < 8; i++) {  // short rays, turning slowly
      const a = (i / 8) * TAU + t * 0.25;
      c.beginPath(); c.moveTo(10 + Math.cos(a) * 4.8, 56 + Math.sin(a) * 4.8); c.lineTo(10 + Math.cos(a) * 6, 56 + Math.sin(a) * 6); c.stroke();
    }
  } else {
    c.fillStyle = "#F4E6A8";
    c.beginPath(); c.arc(10, 56, 4, 0, TAU); c.fill();
    c.globalCompositeOperation = "destination-out";  // bite out the crescent
    c.beginPath(); c.arc(12.3, 57.3, 3.5, 0, TAU); c.fill();
    c.globalCompositeOperation = "source-over";
    for (const [x, y, ph] of [[24, 60, 0], [70, 55, 1.7]]) {
      const s = 0.8 + 0.6 * (0.5 + 0.5 * Math.sin(t * 1.6 + ph));
      c.fillStyle = `rgba(255,246,214,${0.45 + 0.4 * (s - 0.8) / 0.6})`;
      c.beginPath(); c.moveTo(x, y + s * 1.8); c.lineTo(x + s * 0.5, y); c.lineTo(x, y - s * 1.8); c.lineTo(x - s * 0.5, y); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(x + s * 1.8, y); c.lineTo(x, y + s * 0.5); c.lineTo(x - s * 1.8, y); c.lineTo(x, y - s * 0.5); c.closePath(); c.fill();
    }
  }
  c.restore();

  const edge = "rgba(40,28,36,.28)";
  // legs and frame
  c.fillStyle = "#9C7F6C";
  roundRect(c, 13, 0, 3.2, 5, 1.2); c.fill(); roundRect(c, 71.8, 0, 3.2, 5, 1.2); c.fill();
  // headboard: a rounded arch with a quiet inset panel
  c.fillStyle = "#EFE7DD"; c.strokeStyle = edge; c.lineWidth = 0.6;
  c.beginPath(); c.moveTo(16, 8); c.lineTo(16, 30); c.quadraticCurveTo(16, 42, 30, 42); c.lineTo(60, 42); c.quadraticCurveTo(74, 42, 74, 30); c.lineTo(74, 8); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = "rgba(160,135,120,.35)"; c.lineWidth = 0.8;
  c.beginPath(); c.moveTo(21, 14); c.lineTo(21, 29); c.quadraticCurveTo(21, 37.5, 31, 37.5); c.lineTo(59, 37.5); c.quadraticCurveTo(69, 37.5, 69, 29); c.lineTo(69, 14); c.stroke();
  // pillow
  c.fillStyle = "#FFFFFF"; c.strokeStyle = edge; c.lineWidth = 0.5;
  roundRect(c, 27, 17, 36, 10, 4.6); c.fill(); c.stroke();
  c.fillStyle = "rgba(170,160,175,.25)"; roundRect(c, 29, 17.6, 32, 2.2, 1.1); c.fill();

  const breathe = Math.sin(t * TAU / 3.2);
  if (bedOccupied) {
    // its head on the pillow, eyes shut, antenna drooping; stirring, it lifts its head and peeks
    const stir = bedStir - now, stirring = stir > 0;
    c.save();
    c.translate(45, 7.4 + (stirring ? 1.6 : 0.3 * breathe));
    c.scale(0.8, -0.8);  // back to y-down for the creature
    creature(c, { eyes: stirring ? (stir > 1500 || stir < 300 ? "half" : "open") : "closed", mouth: "none", arms: "down",
      blush: false, sweat: false, gear: "", open: 1, lx: 0, ly: 0, big: false, stem: stirring ? 6 : 78, flower: 0, glow: 1.5, breath: breathe });
    c.restore();
  }
  // mattress and sheet
  c.fillStyle = "#FBF8F4"; c.strokeStyle = edge; c.lineWidth = 0.5;
  roundRect(c, 10, 8, 68, 8, 2); c.fill(); c.stroke();
  // the blanket, with a soft fold along the top (a little bump over the sleeper)
  const top = bedOccupied ? 14.2 : 11.5, bump = bedOccupied ? 1.8 + 0.3 * breathe : 0;
  c.fillStyle = "#8D97D6";
  c.beginPath(); c.moveTo(8, 6); c.lineTo(8, top - 1.5); c.quadraticCurveTo(8, top, 11, top);
  c.lineTo(31, top); c.bezierCurveTo(37, top, 39, top + bump, 45, top + bump); c.bezierCurveTo(51, top + bump, 53, top, 59, top);
  c.lineTo(77, top); c.quadraticCurveTo(80, top, 80, top - 1.5); c.lineTo(80, 6); c.quadraticCurveTo(80, 4.6, 78, 4.6); c.lineTo(10, 4.6); c.quadraticCurveTo(8, 4.6, 8, 6); c.closePath();
  c.fill(); c.strokeStyle = "rgba(40,40,80,.3)"; c.stroke();
  c.fillStyle = "#BAC2EC";  // the turned-down cuff
  c.beginPath(); c.moveTo(8.4, top - 3); c.lineTo(8.4, top - 1.4); c.quadraticCurveTo(8.4, top - 0.3, 11, top - 0.3);
  c.lineTo(31, top - 0.3); c.bezierCurveTo(37, top - 0.3, 39, top + bump - 0.3, 45, top + bump - 0.3); c.bezierCurveTo(51, top + bump - 0.3, 53, top - 0.3, 59, top - 0.3);
  c.lineTo(77, top - 0.3); c.quadraticCurveTo(79.6, top - 0.3, 79.6, top - 1.4); c.lineTo(79.6, top - 3); c.closePath(); c.fill();
  c.fillStyle = "rgba(255,255,255,.35)";  // a few tiny stars on the blanket
  for (const [x, y] of [[18, 9], [29, 12], [62, 10], [72, 8.5], [51, 7.5]]) if (y < top - 3.5) { c.beginPath(); c.arc(x, y, 0.7, 0, TAU); c.fill(); }
  // frame rail in front
  c.fillStyle = "#A9907D"; roundRect(c, 9, 2.4, 70, 2.8, 1.4); c.fill();
}

function startBedroom() {
  document.body.classList.add("bedmode");
  const cvb = $("bedcanvas");
  BW = window.innerWidth || 80; BH = window.innerHeight || 66;
  cvb.width = BW * DPR; cvb.height = BH * DPR;
  cvb.style.width = BW + "px"; cvb.style.height = BH + "px";
  bctx = cvb.getContext("2d");
  document.addEventListener("mousedown", (e) => { if (e.button === 0) post({ cmd: "bed" }); });
  // z's drifting up from the sleeper
  setInterval(() => { if (bedOccupied && Date.now() > bedStir) bedFloat("z"); }, 2000);
  setInterval(() => drawBed(), 1000 / 15);
  drawBed();
}

/** A letter drifting up from the sleeper's head. */
function bedFloat(text) {
  const z = document.createElement("span");
  z.className = "fx " + (text === "z" ? "zz" : "mark");
  z.textContent = text;
  z.style.left = "54px";
  z.style.bottom = "30px";
  document.body.appendChild(z);
  z.animate([
    { transform: "translate(0, 0) scale(.7)", opacity: 0 },
    { transform: "translate(3px, -5px) scale(1)", opacity: 0.9, offset: 0.25 },
    { transform: "translate(12px, -20px) scale(.9)", opacity: 0 },
  ], { duration: 2600, easing: "cubic-bezier(.3,.6,.4,1)" }).onfinish = () => z.remove();
}

window.B = {
  // Redraw now rather than on the next tick: macOS may slow this page's timers, and a stale frame
  // would leave a sleeper in the bed after the pet has got up.
  occupied(on) { bedOccupied = on; drawBed(); },
  stir() {
    if (!bedOccupied) return;
    bedStir = Date.now() + 1800;
    drawBed();
    setTimeout(() => bedFloat("!"), 300);
    setTimeout(drawBed, 1850);
  },
  sky(s) { bedSky = s; drawBed(); },
  mood(m) { if (MOODS[m]) mood = m; },
  theme(t) { lock = LOCKS[t] ? t : null; },
};

if (BEDMODE) {
  startBedroom();
} else {
  fit();
  window.addEventListener("resize", fit);
  P.energy(energy);
  requestAnimationFrame(loop);
  // If this page's animation frames are held back while it's on screen, keep drawing anyway (not while it's
  // tucked away in bed, when its window is hidden).
  setInterval(() => { if (!document.hidden && performance.now() - lastT > 120) frame(performance.now()); }, 50);
  // How smoothly it's drawing, for the debug build's dump.
  let frames = 0, since = performance.now();
  const count = () => { frames++; requestAnimationFrame(count); };
  requestAnimationFrame(count);
  setInterval(() => { post({ cmd: "fps", v: Math.round(frames / ((performance.now() - since) / 1000)) }); frames = 0; since = performance.now(); }, 3000);
}
</script>
